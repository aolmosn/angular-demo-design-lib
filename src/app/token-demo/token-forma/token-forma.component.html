<section class="grid-1 md:grid-2 xl:grid-3 gap-default w-full">

  <!-- Radios -->
  <section class="card" aria-label="Radio de borde" style="flex: 1;">
    <div class="card-header">
      <h2>Radio de borde</h2>
    </div>
    <div class="card-body">
      <div class="radius-grid">
        <div class="radius-box"
          *ngFor="let r of radii"
          [style.border-radius]="'var(' + r.cssVar + ')'">
          <code class="t-chip">{{ r.cssVar }}</code>
          <span class="hint">{{ r.hint }}</span>
        </div>
      </div>
    </div>
  </section>

  <!-- Espaciado -->
  <section class="card" aria-label="Espaciado" style="flex: 1;">
    <div class="card-header">
      <h2>Espaciado</h2>
    </div>
    <div class="card-body">
      <p class="desc">Base de 4px. Usar en <code>padding</code>, <code>gap</code>, <code>margin</code>.</p>
      <div class="spacing-list">
        <div class="spacing-item" *ngFor="let s of spacings">
          <div class="spacing-bar-wrap">
            <div class="spacing-bar" [style.width]="'var(' + s.cssVar + ')'"></div>
          </div>
          <code class="t-chip">{{ s.cssVar }}</code>
          <span class="hint">{{ s.hint }}</span>
        </div>
      </div>
    </div>
  </section>

  <!-- Sombras -->
  <section class="card" aria-label="Sombras" style="flex: 1;">
    <div class="card-header">
      <h2>Sombras</h2>
    </div>
    <div class="card-body">
      <div class="shadow-stack">
        <div class="shadow-box"
          *ngFor="let s of shadows"
          [style.box-shadow]="'var(' + s.cssVar + ')'">
          <code class="t-chip">{{ s.cssVar }}</code>
          <span class="hint">{{ s.desc }}</span>
        </div>
      </div>
    </div>
  </section>

</section>

<style>
  .desc {
    font-size: var(--wk-font-size-b2);
    color: var(--wk-color-on-surface-muted);
    margin: 0 0 1rem;

    code {
      font-family: ui-monospace, monospace;
      font-size: 0.8em;
      background: var(--wk-color-surface-alt);
      padding: 1px 4px;
      border-radius: 3px;
    }
  }

  .t-chip {
    display: inline-block;
    font-family: ui-monospace, monospace;
    font-size: 0.68rem;
    background: var(--wk-color-surface-raised);
    color: var(--wk-color-on-surface-muted);
    border: 1px solid var(--wk-color-border);
    border-radius: var(--wk-radius-sm);
    padding: 2px 6px;
  }

  .hint {
    font-family: ui-monospace, monospace;
    font-size: var(--wk-font-size-b4);
    color: var(--wk-color-on-surface-muted);
  }

  /* Radios */
  .radius-grid { display: flex; flex-wrap: wrap; gap: 1rem; }

  .radius-box {
    width: 80px;
    height: 80px;
    background: var(--wk-color-action-subtle);
    border: 2px solid var(--wk-color-action);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 0.5rem;
  }

  /* Spacing */
  .spacing-list { display: flex; flex-direction: column; gap: 10px; }

  .spacing-item {
    display: grid;
    grid-template-columns: 52px 1fr auto;
    align-items: center;
    gap: 0.75rem;
  }

  .spacing-bar-wrap { width: 52px; }

  .spacing-bar {
    height: 14px;
    min-width: 2px;
    max-width: 52px;
    background: var(--wk-color-action);
    border-radius: 2px;
  }

  /* Shadows */
  .shadow-stack { display: flex; flex-direction: column; gap: 1.5rem; padding: 0.5rem 0 1rem; }

  .shadow-box {
    background: var(--wk-color-surface);
    border-radius: var(--wk-radius-lg);
    padding: 1rem 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
</style>
