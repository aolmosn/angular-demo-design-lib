<section class="card" aria-labelledby="trigger-externo-title">
  <div class="card-header">
    <h2 id="trigger-externo-title">Trigger externo</h2>
  </div>

  <div class="card-body">
    <div class="flex-col gap-16">

      <p style="font-size:0.875rem;color:var(--wk-gray-500, #6b7280)">
        Usá <code>setTrigger(el)</code> cuando ya tenés tu propio botón como disparador.
        El ícono ⋮ interno no se renderiza y el posicionamiento se calcula respecto al botón externo.
      </p>

      <!-- Demo -->
      <div class="flex-row gap-8 flex-a-c">
        <button #boton class="btn btn--secondary" (click)="toggle()">
          Acciones ▼
        </button>
        <ui-kebab-container #kebab>
          <ui-kebab-option icon="edit">Editar</ui-kebab-option>
          <ui-kebab-option icon="content_copy">Duplicar</ui-kebab-option>
          <ui-kebab-option icon="delete">Eliminar</ui-kebab-option>
        </ui-kebab-container>
      </div>

      <!-- Snippet HTML -->
      <div style="background:#0f172a;border-radius:8px;overflow:hidden;">
        <div style="display:flex;align-items:center;justify-content:space-between;
                    padding:0.5rem 1rem;border-bottom:1px solid rgba(255,255,255,0.07);">
          <span style="font-size:0.7rem;color:#64748b;font-family:monospace;
                       text-transform:uppercase;letter-spacing:0.07em;">HTML</span>
        </div>
        <pre style="margin:0;padding:1rem 1.25rem;font-size:0.8125rem;color:#e2e8f0;
                    overflow-x:auto;font-family:'JetBrains Mono',Consolas,monospace;
                    white-space:pre;line-height:1.65;">{{ codeHtml }}</pre>
      </div>

      <!-- Snippet TypeScript -->
      <div style="background:#0f172a;border-radius:8px;overflow:hidden;">
        <div style="display:flex;align-items:center;justify-content:space-between;
                    padding:0.5rem 1rem;border-bottom:1px solid rgba(255,255,255,0.07);">
          <span style="font-size:0.7rem;color:#64748b;font-family:monospace;
                       text-transform:uppercase;letter-spacing:0.07em;">TypeScript</span>
        </div>
        <pre style="margin:0;padding:1rem 1.25rem;font-size:0.8125rem;color:#e2e8f0;
                    overflow-x:auto;font-family:'JetBrains Mono',Consolas,monospace;
                    white-space:pre;line-height:1.65;">{{ codeTs }}</pre>
      </div>

    </div>
  </div>
</section>
