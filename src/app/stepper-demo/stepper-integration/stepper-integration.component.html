<section class="card w-full" aria-labelledby="stp-int-title">
  <div class="card-header">
    <h2 id="stp-int-title">Integración del componente</h2>
  </div>

  <div class="card-body flex-col gap-16">

    <p style="font-size:0.875rem;color:var(--wk-color-on-surface-muted,#546e7a);margin:0;">
      <code>steps</code> y <code>valid</code> se pasan como <strong>propiedades JS</strong>
      (no como atributos). <code>current</code> puede pasarse como atributo HTML
      (<code>[attr.current]</code>) para modo controlado.
    </p>

    <div style="background:#0f172a;border-radius:8px;overflow:hidden;">
      <div style="display:flex;align-items:center;padding:0.5rem 1rem;
                  border-bottom:1px solid rgba(255,255,255,0.07);">
        <span style="font-size:0.7rem;color:#64748b;font-family:monospace;
                     text-transform:uppercase;letter-spacing:0.07em;">HTML</span>
      </div>
      <pre style="margin:0;padding:1rem 1.25rem;font-size:0.8125rem;color:#e2e8f0;
                  overflow-x:auto;font-family:'JetBrains Mono',Consolas,monospace;
                  white-space:pre;line-height:1.65;">{{ codeHtml }}</pre>
    </div>

    <div style="background:#0f172a;border-radius:8px;overflow:hidden;">
      <div style="display:flex;align-items:center;padding:0.5rem 1rem;
                  border-bottom:1px solid rgba(255,255,255,0.07);">
        <span style="font-size:0.7rem;color:#64748b;font-family:monospace;
                     text-transform:uppercase;letter-spacing:0.07em;">TypeScript</span>
      </div>
      <pre style="margin:0;padding:1rem 1.25rem;font-size:0.8125rem;color:#e2e8f0;
                  overflow-x:auto;font-family:'JetBrains Mono',Consolas,monospace;
                  white-space:pre;line-height:1.65;">{{ codeTs }}</pre>
    </div>

    <div style="background:#0f172a;border-radius:8px;overflow:hidden;">
      <div style="display:flex;align-items:center;padding:0.5rem 1rem;
                  border-bottom:1px solid rgba(255,255,255,0.07);">
        <span style="font-size:0.7rem;color:#64748b;font-family:monospace;
                     text-transform:uppercase;letter-spacing:0.07em;">TypeScript — eventos externos</span>
      </div>
      <pre style="margin:0;padding:1rem 1.25rem;font-size:0.8125rem;color:#e2e8f0;
                  overflow-x:auto;font-family:'JetBrains Mono',Consolas,monospace;
                  white-space:pre;line-height:1.65;">{{ codeExternal }}</pre>
    </div>

  </div>
</section>
